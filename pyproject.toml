[project]
name = "jobjeeves"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "python-multipart==0.0.9",
  "pypdf==5.2.0",
  "openai==1.61.1",
  "sqlalchemy==2.0.36",
  "sqlmodel==0.0.22",
  "pydantic-settings==2.7.1",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build && node ../scripts/copy-frontend-to-public.mjs"
